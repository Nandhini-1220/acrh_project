<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient Dashboard - PhysioCare AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="app-page">
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <h1>Patient Dashboard #{{ patient_id }}</h1>
        <p class="subtitle">Your Physiotherapy Exercises</p>
      </div>
      <nav class="nav">
        <a class="btn ghost" href="/patient_levels/{{ patient_id }}">Levels</a>
        <a class="btn secondary" href="/">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero card">
      <div class="hero-text">
        <h2>Welcome Patient #{{ patient_id }}!</h2>
        <p>Follow your prescribed exercises with camera guidance.</p>
        <div class="actions">
          <a class="btn" href="/patient_levels/{{ patient_id }}">Start Levels</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2025 PhysioCare AI</span>
    </div>
  </footer>
</body>
</html>

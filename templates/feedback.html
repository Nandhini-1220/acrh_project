<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback - Physio Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <h1>Great work!</h1>
        <p class="subtitle">Exercise completed</p>
      </div>
      <nav class="nav">
        <a class="btn secondary" href="{{ url_for('index') }}">Home</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h3>Session summary</h3>
      <p>You finished: <strong>{{ exercise_key or 'your exercise' }}</strong></p>
      <p>Enter reps completed to save progress:</p>
      <form method="POST">
        <div class="form-group">
          <label for="reps">Reps completed (Level {{ level }}):</label>
          <input type="number" id="reps" name="reps" min="0" required>
        </div>
        <button type="submit" class="btn">Save Progress</button>
      </form>
      <div class="actions">
        <a class="btn secondary" href="{{ url_for('patient', patient_id=patient_id) }}">Back to Levels</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="btn secondary" href="{{ url_for('index') }}">Home</a>
    </div>
  </footer>
</body>
</html>

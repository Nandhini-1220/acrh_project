<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysioCare AI - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Athlete-Centric Recovery Hub</h1>
<h2>Welcome back</h2>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <p>Select your role to access your rehabilitation workspace.</p>
      
      <form method="POST" action="/">
        <div class="form-group">
          <label for="role">Select Role</label>
          <select id="role" name="role" class="form-control" required style="color: #333; background-color: white;" onchange="toggleFields()">
            <option value="">Choose...</option>
            <option value="Patient">Patient</option>
            <option value="Therapist">Therapist</option>
          </select>
        </div>
        
        <div class="form-group" id="patient_id_group" style="display: none;">
          <label for="patient_id">Patient ID</label>
          <input type="number" id="patient_id" name="patient_id" min="1" max="999" placeholder="Enter your Patient ID">
        </div>
        
        <div class="form-group" id="therapist_email_group" style="display: none;">
          <label for="therapist_email">Therapist Email</label>
          <input type="email" id="therapist_email" name="therapist_email" placeholder="Enter your email">
        </div>
        
        <button type="submit" class="login-btn btn">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    function toggleFields() {
      const role = document.getElementById('role').value;
      const patientGroup = document.getElementById('patient_id_group');
      const therapistGroup = document.getElementById('therapist_email_group');
      const patientInput = document.getElementById('patient_id');
      const therapistInput = document.getElementById('therapist_email');
      
      if (role === 'Patient') {
        patientGroup.style.display = 'block';
        therapistGroup.style.display = 'none';
        patientInput.required = true;
        therapistInput.required = false;
      } else if (role === 'Therapist') {
        patientGroup.style.display = 'none';
        therapistGroup.style.display = 'block';
        patientInput.required = false;
        therapistInput.required = true;
      } else {
        patientGroup.style.display = 'none';
        therapistGroup.style.display = 'none';
        patientInput.required = false;
        therapistInput.required = false;
      }
    }
  </script>
</body>
</html>

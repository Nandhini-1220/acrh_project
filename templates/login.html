<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysioCare AI - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Athlete-Centric Recovery Hub</h1>
<h2>Welcome back</h2>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <p>Select your role and enter your Development ID and Passcode.</p>
      <div style="background-color: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 0.9em;">
        <strong>Dev Credentials:</strong><br>
        Patient IDs: 1, 2, 3, 4, 5<br>
        Therapist ID: 6<br>
        Passcode for all: dev123
      </div>
      <form method="POST" action="/">
        <div class="form-group">
          <label for="role">Select Role</label>
          <select id="role" name="role" class="form-control" required style="color: #333; background-color: white;">
            <option value="">Choose...</option>
            <option value="Patient">Patient</option>
            <option value="Therapist">Therapist</option>
          </select>
        </div>
        <div class="form-group">
          <label for="user_id">User ID (Patient or Therapist ID)</label>
          <input type="number" id="user_id" name="user_id" min="1" max="999" placeholder="e.g. 1" required>
        </div>
        <div class="form-group">
          <label for="passcode">Development Passcode</label>
          <input type="password" id="passcode" name="passcode" placeholder="Enter passcode" required>
        </div>
        <button type="submit" class="login-btn btn">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
